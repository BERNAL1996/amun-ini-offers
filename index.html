<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amun Ini Resort & Spa - Booking</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f1e8;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .page {
      width: 90%;
      max-width: 500px;
      padding: 40px 25px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .intro {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .phone {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .contact-icons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 55px;
    }

    .contact-icons a {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      transition: transform 0.2s;
    }

    .contact-icons a:hover {
      transform: scale(1.08);
    }

    .contact-icons img {
      width: 38px;
      height: 38px;
    }

    .brand {
      margin-top: 20px;
    }

    .brand-name {
      font-size: 24px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .brand-subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      margin-top: 7px;
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>Booking & Assistance</h1>

    <div class="intro">
      To book or check availability, please ask our staff for assistance
      or click the buttons below to contact us.
    </div>

    <div class="phone">
      +63 939 903 4536
    </div>

    <div class="contact-icons">

      <!-- WhatsApp -->
      <a href="https://wa.me/639399034536" target="_blank" aria-label="WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
      </a>

      <!-- Phone Call -->
<a href="tel:+639399034536" aria-label="Call Amun Ini">
  <span style="font-size: 38px;">📞</span>
</a>

    </div>

    <div class="brand">
      <div class="brand-name">AMUN INI</div>
      <div class="brand-subtitle">BEACH RESORT & SPA</div>
    </div>

  </div>

</body>
</html>
